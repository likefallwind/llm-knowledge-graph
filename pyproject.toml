[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-knowledge-graph"
version = "0.1.0"
description = "A minimal, corpus-grounded AI knowledge graph pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
yaml = ["PyYAML>=6"]

[project.scripts]
kg = "kg.cli:main"

[tool.setuptools.packages.find]
include = ["kg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
